name: Release extension

on:
  push:
    tags:
      - "vscode-bend2-v*"

permissions:
  contents: write

concurrency:
  group: extension-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify tag and package versions
        id: version
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          EXPECTED_TAG="vscode-bend2-v${VERSION}"
          if [ "$GITHUB_REF_NAME" != "$EXPECTED_TAG" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $VERSION." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "vsix=$RUNNER_TEMP/bend2-language-support-$VERSION.vsix" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: npm test

      - name: Check JavaScript syntax
        run: npm run check

      - name: Package VSIX
        run: npx vsce package --out "${{ steps.version.outputs.vsix }}"

      - name: Publish to Open VSX
        run: npx ovsx publish "${{ steps.version.outputs.vsix }}"
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

      - name: Create GitHub Release
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.version.outputs.vsix }}#Bend 2 Language Support ${{ steps.version.outputs.version }}" \
            --verify-tag \
            --title "Bend 2 Language Support ${{ steps.version.outputs.version }}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
